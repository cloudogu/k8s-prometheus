{{ $kubePromStack := index .Values "kube-prometheus-stack" }}
{{- /* This role is part of the job to resize the PVC and only required if a storage size is specified. */ -}}
{{- if $kubePromStack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "kube-prometheus-stack.prometheus.crname" . }}-pvc-resize
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "delete"]
  - apiGroups: [ "" ]
    resources: [ "persistentvolumeclaims" ]
    verbs: ["get", "list", "patch"]
{{- end }}

{{ $kubePromStack := index .Values "kube-prometheus-stack" }}
{{- $storage := dig "prometheus" "prometheusSpec" "storageSpec" "volumeClaimTemplate" "spec" "resources" "requests" "storage" nil $kubePromStack }}
{{- /* If no storage size is specified, we don't need this job. */ -}}
{{- if $storage }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "job.resize.name" . }}
  labels:
    {{- include "k8s-prometheus.labels" . | nindent 4 }}
    {{- if .Values.prometheusStorageResize.annotations.jobRBAC}}
  annotations:
    {{- toYaml .Values.prometheusStorageResize.annotations.jobRBAC | nindent 4 }}
  {{- end}}
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "delete", "deletecollection"]
  - apiGroups: [ "" ]
    resources: [ "persistentvolumeclaims" ]
    verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "job.resize.name" . }}
  labels:
    {{- include "k8s-prometheus.labels" . | nindent 4 }}
  {{- if .Values.prometheusStorageResize.annotations.jobRBAC}}
  annotations:
    {{- toYaml .Values.prometheusStorageResize.annotations.jobRBAC | nindent 4 }}
  {{- end}}
subjects:
  - kind: ServiceAccount
    name: {{ template "job.resize.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "job.resize.name" . }}
  
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "job.resize.name" . }}
  labels:
    {{- include "k8s-prometheus.labels" . | nindent 4 }}
  {{- if .Values.prometheusStorageResize.annotations.jobRBAC}}
  annotations:
    {{- toYaml .Values.prometheusStorageResize.annotations.jobRBAC | nindent 4 }}
  {{- end}}
automountServiceAccountToken: true
{{- if .Values.global.imagePullSecrets}}
imagePullSecrets:
  {{- range .Values.global.imagePullSecrets }}
  - name: {{.}}
  {{- end }}
{{- end }}

{{- end }}

{{ $kubePromStack := index .Values "kube-prometheus-stack" }}
{{- /* This service account is part of the job to resize the PVC and only required if a storage size is specified. */ -}}
{{- if $kubePromStack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate }}
{{- if $kubePromStack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "kube-prometheus-stack.prometheus.crname" . }}-storage-resize
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
  {{- if .Values.prometheusStorageResize.annotations.jobRBAC}}
  annotations:
    {{- toYaml .Values.prometheusStorageResize.annotations.jobRBAC | nindent 4 }}
  {{- end}}
automountServiceAccountToken: true
{{- if .Values.global.imagePullSecrets}}
imagePullSecrets:
  {{- range .Values.global.imagePullSecrets }}
  - name: {{.}}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}